[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.chumon.ca/*"
  to = "https://chumon.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/realisations"
  to = "/#realisations"
  status = 301
  force = true

[[redirects]]
  from = "/en/work"
  to = "/en#realisations"
  status = 301
  force = true

[[redirects]]
  from = "/approche"
  to = "/#approche"
  status = 301
  force = true

[[redirects]]
  from = "/en/approach"
  to = "/en#approche"
  status = 301
  force = true

[[redirects]]
  from = "/a-propos"
  to = "/#a-propos"
  status = 301
  force = true

[[redirects]]
  from = "/en/about"
  to = "/en#a-propos"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
  force = true

[[redirects]]
  from = "/en/contact"
  to = "/en#contact"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

